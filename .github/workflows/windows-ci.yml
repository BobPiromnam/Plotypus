name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and configuration
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check app.js
          node --check config.js
          node --check feedback.js
          node --check geometry.js
          node --check icons.js
          node --check label-layout.js
          node --check presets.js
          node --check project-io.js
          node --check project-file.js
          node --check properties.js
          node --check tests/headless-smoke-runner.cjs
          node --check tests/validate-config.cjs
          node --check workspace.js

      - name: Validate configuration
        shell: pwsh
        run: node tests/validate-config.cjs plotypus.config.json

      - name: Run unit tests
        shell: pwsh
        run: node --test tests/config-parity.test.cjs tests/feedback.test.cjs tests/geometry.test.cjs tests/label-geometry.test.cjs tests/label-layout.test.cjs tests/properties-panel.test.cjs tests/region-matching.test.cjs tests/render-scheduling.test.cjs tests/typography.test.cjs

  browser-smoke:
    name: Shell and map smoke
    runs-on: windows-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run core shell smoke test
        shell: pwsh
        run: ./tests/run-shell-smoke.ps1 -SkipScreenshot

      - name: Run focused sample smoke test
        shell: pwsh
        run: ./tests/run-shell-smoke.ps1 -Workspace preview -LoadSample -VisualCapture -SkipScreenshot

      - name: Run bilingual table layout smoke tests
        shell: pwsh
        run: |
          ./tests/run-shell-smoke.ps1 -Workspace projects -LoadSample -TableLayoutOnly -SkipScreenshot
          ./tests/run-shell-smoke.ps1 -Workspace regions -LoadSample -TableLayoutOnly -SkipScreenshot
          ./tests/run-shell-smoke.ps1 -Workspace translate -LoadSample -TableLayoutOnly -SkipScreenshot

      - name: Run map output smoke test
        shell: pwsh
        run: ./tests/run-smoke.ps1

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-failure-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            tests/smoke-output/**/shell-*.png
            tests/smoke-output/**/shell-dom.html
            tests/smoke-output/**/shell-dom.err
            tests/smoke-output/**/smoke-labels*.png
            tests/smoke-output/**/smoke-labels*.html
            tests/smoke-output/**/smoke-labels*.err
            tests/smoke-output/**/server.out
            tests/smoke-output/**/server.err

  visual-regression:
    name: Visual review
    runs-on: windows-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture workspace comparisons
        shell: pwsh
        run: ./tests/run-visual-regression.ps1 -ReportOnly

      - name: Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-visual-review-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            tests/visual-output/**/*.png
            tests/visual-output/**/*.json
            tests/smoke-output/**/shell-*.png
            tests/smoke-output/**/shell-dom.html
            tests/smoke-output/**/shell-dom.err
            tests/smoke-output/**/server.out
            tests/smoke-output/**/server.err
