name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit and configuration
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install validation tooling
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check app.js
          node --check city-integration.js
          node --check config.js
          node --check data/cities.js
          node --check feedback.js
          node --check geometry.js
          node --check icons.js
          node --check label-layout.js
          node --check presets.js
          node --check project-io.js
          node --check project-file.js
          node --check properties.js
          node --check reference-cities.js
          node --check src/lib/city-search.js
          node --check src/lib/city-search-runtime.js
          node --check tests/headless-smoke-runner.cjs
          node --check tests/run-unit-tests.cjs
          node --check tests/validate-performance-report.cjs
          node --check tests/validate-runtime-assets.cjs
          node --check tests/validate-workflows.cjs
          node --check tests/validate-config.cjs
          node --check tools/build-reference-city-runtime.cjs
          node --check tools/build-cities.js
          node --check workspace.js

      - name: Validate configuration
        shell: pwsh
        run: node tests/validate-config.cjs plotypus.config.json

      - name: Validate offline runtime assets
        shell: pwsh
        run: node tests/validate-runtime-assets.cjs

      - name: Validate portable reference-city runtime
        shell: pwsh
        run: node tools/build-reference-city-runtime.cjs --check

      - name: Run reference-city search self-test
        shell: pwsh
        run: node src/lib/city-search.js

      - name: Validate GitHub workflow syntax
        shell: pwsh
        run: node tests/validate-workflows.cjs

      - name: Run unit tests
        shell: pwsh
        run: node tests/run-unit-tests.cjs

      - name: Audit CSS architecture
        shell: pwsh
        run: node tools/css-selector-audit.cjs

  browser-smoke:
    name: Shell and map smoke
    runs-on: windows-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run core shell smoke test
        shell: pwsh
        run: ./tests/run-shell-smoke.ps1 -SkipScreenshot

      - name: Run focused sample smoke test
        shell: pwsh
        run: ./tests/run-shell-smoke.ps1 -Workspace preview -LoadSample -VisualCapture -StrictDiagnostics -SkipScreenshot

      - name: Enforce Windows performance regression ceilings
        shell: pwsh
        run: |
          ./tests/run-shell-smoke.ps1 -Workspace preview -LoadSample -VisualCapture -MeasurePerformance -StrictDiagnostics -SkipScreenshot -ReportPath tests/smoke-output/performance-report.json
          node tests/validate-performance-report.cjs tests/smoke-output/performance-report.json tests/windows-ci-performance-budgets.json

      - name: Round-trip a populated saved project
        shell: pwsh
        run: ./tests/run-shell-smoke.ps1 -Workspace preview -LoadSample -VisualCapture -ProjectRoundTrip -StrictDiagnostics -SkipScreenshot

      - name: Run bilingual table layout smoke tests
        shell: pwsh
        run: |
          ./tests/run-shell-smoke.ps1 -Workspace projects -LoadSample -TableLayoutOnly -SkipScreenshot
          ./tests/run-shell-smoke.ps1 -Workspace regions -LoadSample -TableLayoutOnly -SkipScreenshot
          ./tests/run-shell-smoke.ps1 -Workspace translate -LoadSample -TableLayoutOnly -SkipScreenshot

      - name: Run map output smoke test
        shell: pwsh
        run: ./tests/run-smoke.ps1

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-failure-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            tests/smoke-output/**/shell-*.png
            tests/smoke-output/**/shell-dom.html
            tests/smoke-output/**/shell-dom.err
            tests/smoke-output/**/smoke-labels*.png
            tests/smoke-output/**/smoke-labels*.html
            tests/smoke-output/**/smoke-labels*.err
            tests/smoke-output/**/server.out
            tests/smoke-output/**/server.err

  accessibility:
    name: Accessibility
    runs-on: windows-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install accessibility tooling
        shell: pwsh
        run: npm ci --ignore-scripts

      - name: Audit rendered workspaces and dialogs
        shell: pwsh
        run: ./tests/run-accessibility-smoke.ps1

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-accessibility-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: tests/smoke-output/accessibility/*.json

  responsive:
    name: Responsive (${{ matrix.width }}px)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 1280, 1080, 1024, 840, 620]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run bilingual table and Properties checks
        shell: pwsh
        run: ./tests/run-responsive-matrix.ps1 -Widths ${{ matrix.width }}

      - name: Upload responsive failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-responsive-${{ matrix.width }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            tests/smoke-output/**/shell-dom.html
            tests/smoke-output/**/shell-dom.err
            tests/smoke-output/**/server.out
            tests/smoke-output/**/server.err

  visual-regression:
    name: Visual regression
    runs-on: windows-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enforce workspace visual baselines
        shell: pwsh
        run: ./tests/run-visual-regression.ps1

      - name: Upload visual review artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-visual-review-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            tests/visual-output/**/*.png
            tests/visual-output/**/*.json
            tests/smoke-output/**/shell-*.png
            tests/smoke-output/**/shell-dom.html
            tests/smoke-output/**/shell-dom.err
            tests/smoke-output/**/server.out
            tests/smoke-output/**/server.err
