<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plotypus shell interaction smoke</title>
  <style>
    html, body { height: 100%; margin: 0; font: 14px system-ui, sans-serif; }
    #app { display: block; width: 100%; height: 100%; border: 0; }
    #result { position: fixed; left: 8px; bottom: 8px; z-index: 10; width: 320px; max-height: 112px; overflow: auto; margin: 0; padding: 8px; background: rgba(255,255,255,.96); border: 1px solid #333; font: 10px/1.3 monospace; white-space: pre-wrap; }
    html.is-visual-capture #result { display: none; }
  </style>
</head>
<body>
  <iframe id="app" title="Plotypus application under test" data-src="../index.html?v=20260624-i18n-quality"></iframe>
  <pre id="result">{"status":"running"}</pre>
  <script>
    const result = document.querySelector("#result");
    const frame = document.querySelector("#app");
    const frameErrors = [];
    const params = new URLSearchParams(location.search);
    const requestedWorkspace = params.get("workspace") || "";
    const requestedDialog = params.get("dialog") || "";
    const loadSample = params.get("sample") === "1";
    const tableLayoutOnly = params.get("tableLayout") === "1";
    const measurePerformance = params.get("performance") === "1";
    const visualCapture = params.get("visual") === "1";
    const seededCanvasZoom = Number(params.get("canvasZoom"));
    const canvasZoomLevels = [25, 33, 50, 67, 75, 90, 100, 110, 125, 150, 175, 200];
    const initialCanvasZoom = canvasZoomLevels.includes(seededCanvasZoom) ? seededCanvasZoom : 125;
    if (visualCapture) document.documentElement.classList.add("is-visual-capture");
    try {
      localStorage.removeItem("plotypus.propertiesPanel");
      localStorage.removeItem("plotypus.uiLanguage");
      if (canvasZoomLevels.includes(seededCanvasZoom)) {
        localStorage.setItem("plotypus.canvasViewZoom", JSON.stringify(seededCanvasZoom));
      } else {
        localStorage.removeItem("plotypus.canvasViewZoom");
      }
    } catch (_error) {
      // Storage may be unavailable in a locked-down browser profile.
    }
    function waitFor(predicate, timeout = 8000) {
      const started = performance.now();
      return new Promise((resolve, reject) => {
        const poll = () => {
          try {
            const value = predicate();
            if (value) return resolve(value);
          } catch (_error) {
            // The frame may still be navigating.
          }
          if (performance.now() - started > timeout) return reject(new Error("Timed out waiting for application readiness"));
          setTimeout(poll, 50);
        };
        poll();
      });
    }

    function dispatchKey(target, key) {
      const View = target.ownerDocument?.defaultView?.KeyboardEvent || KeyboardEvent;
      target.dispatchEvent(new View("keydown", { key, bubbles: true, cancelable: true }));
    }

    function assert(checks, name, pass, detail = "") {
      checks.push({ name, pass: Boolean(pass), detail });
      result.dataset.lastCheck = name;
      result.dataset.checkCount = String(checks.length);
    }

    function isRenderedLayoutElement(element) {
      if (!element) return false;
      const style = element.ownerDocument.defaultView.getComputedStyle(element);
      const rect = element.getBoundingClientRect();
      return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
    }

    function elementContentBounds(element) {
      if (!element) return null;
      const range = element.ownerDocument.createRange();
      range.selectNodeContents(element);
      const rect = range.getBoundingClientRect();
      range.detach?.();
      return rect;
    }

    function selectOptionTextFit(select, optionText, arrowAllowance = 0) {
      if (!select || !optionText) return { pass: false, detail: "select or option missing" };
      const doc = select.ownerDocument;
      const view = doc.defaultView;
      const style = view.getComputedStyle(select);
      const probe = doc.createElement("span");
      probe.textContent = optionText;
      probe.style.position = "fixed";
      probe.style.left = "-10000px";
      probe.style.top = "0";
      probe.style.whiteSpace = "nowrap";
      probe.style.font = style.font;
      probe.style.fontFamily = style.fontFamily;
      probe.style.fontSize = style.fontSize;
      probe.style.fontWeight = style.fontWeight;
      probe.style.letterSpacing = style.letterSpacing;
      probe.style.textTransform = style.textTransform;
      doc.body.append(probe);
      const textWidth = probe.getBoundingClientRect().width;
      probe.remove();
      const paddingLeft = parseFloat(style.paddingLeft) || 0;
      const paddingRight = parseFloat(style.paddingRight) || 0;
      // These selects reserve their arrow inside computed right padding, so the
      // default probe must not add that affordance a second time.
      const requiredWidth = textWidth + paddingLeft + paddingRight + arrowAllowance;
      return {
        pass: requiredWidth <= select.clientWidth + 1,
        detail: `${optionText}: text=${Math.round(textWidth)}, padding=${paddingLeft}/${paddingRight}, arrow=${arrowAllowance}, required=${Math.round(requiredWidth)}, available=${select.clientWidth}`
      };
    }

    function semanticTableLayout(table, { utilitySelectors = [], bodyTextSelectors = [], minimumWidth = 0, expectedInlinePadding = 16 } = {}) {
      if (!table) return { pass: false, detail: "table missing" };
      const view = table.ownerDocument.defaultView;
      const wrapper = table.closest(".table-wrap, .csv-preview-table-wrap");
      const tableRect = table.getBoundingClientRect();
      const tableStyle = view.getComputedStyle(table);
      const headers = Array.from(table.querySelectorAll("thead th")).filter(isRenderedLayoutElement);
      const headerMetrics = headers.map(header => {
        const rect = header.getBoundingClientRect();
        const style = view.getComputedStyle(header);
        const paddingLeft = parseFloat(style.paddingLeft) || 0;
        const paddingRight = parseFloat(style.paddingRight) || 0;
        const contentRect = elementContentBounds(header);
        const contentFits = !contentRect || contentRect.width <= 0 || (
          contentRect.left >= rect.left + paddingLeft - 1
          && contentRect.right <= rect.right - paddingRight + 1
        );
        return {
          label: header.textContent.trim().replace(/\s+/g, " "),
          paddingLeft,
          paddingRight,
          pass: header.scrollWidth <= header.clientWidth + 1 && contentFits
        };
      });
      const headersFit = headers.length > 0 && headerMetrics.every(metric => metric.pass);
      const headerPaddingIsConsistent = headerMetrics.every(metric => (
        metric.paddingLeft >= 8
        && metric.paddingRight >= 8
        && Math.abs(metric.paddingLeft - metric.paddingRight) <= 1
        && Math.abs(metric.paddingLeft - expectedInlinePadding) <= 1
        && Math.abs(metric.paddingRight - expectedInlinePadding) <= 1
      ));
      const firstRow = table.querySelector("tbody tr");
      const bodyTextMetrics = bodyTextSelectors.map(selector => {
        const element = firstRow?.querySelector(selector);
        if (!isRenderedLayoutElement(element)) return null;
        const style = view.getComputedStyle(element);
        const paddingLeft = parseFloat(style.paddingLeft) || 0;
        const paddingRight = parseFloat(style.paddingRight) || 0;
        const reservesNativeArrow = element.matches("select");
        return {
          selector,
          pass: Math.abs(paddingLeft - expectedInlinePadding) <= 1
            && (reservesNativeArrow ? paddingRight >= expectedInlinePadding : Math.abs(paddingRight - expectedInlinePadding) <= 1),
          detail: `${selector}:${paddingLeft}/${paddingRight}${reservesNativeArrow ? ":select" : ""}`
        };
      }).filter(Boolean);
      const expectedRenderedBodyTextCount = bodyTextSelectors.filter(selector => isRenderedLayoutElement(firstRow?.querySelector(selector))).length;
      const bodyTextPaddingIsConsistent = bodyTextMetrics.length === expectedRenderedBodyTextCount && bodyTextMetrics.length > 0 && bodyTextMetrics.every(metric => metric.pass);
      const utilityMetrics = utilitySelectors.map(selector => {
        const header = table.querySelector(`thead ${selector}`);
        if (!isRenderedLayoutElement(header)) return null;
        const cell = firstRow?.cells?.[header.cellIndex];
        if (!isRenderedLayoutElement(cell)) return { selector, pass: false, detail: "cell missing" };
        const cellRect = cell.getBoundingClientRect();
        const children = Array.from(cell.children).filter(isRenderedLayoutElement);
        const childrenFit = children.every(child => {
          const rect = child.getBoundingClientRect();
          return rect.left >= cellRect.left - 1 && rect.right <= cellRect.right + 1;
        });
        return {
          selector,
          pass: cell.scrollWidth <= cell.clientWidth + 1 && childrenFit,
          detail: `${Math.round(cell.scrollWidth)}/${Math.round(cell.clientWidth)}`
        };
      }).filter(Boolean);
      const parsedMinimumWidth = parseFloat(tableStyle.minWidth) || 0;
      const wrapperStyle = wrapper ? view.getComputedStyle(wrapper) : null;
      const wrapperCanScroll = Boolean(wrapper && ["auto", "scroll"].includes(wrapperStyle.overflowX));
      const shouldScrollAtNarrowWidth = view.innerWidth <= 1080 && tableRect.width > (wrapper?.clientWidth || 0) + 1;
      const horizontalOverflowIsContained = Boolean(wrapper)
        && wrapperCanScroll
        && tableRect.width >= parsedMinimumWidth - 1
        && (!shouldScrollAtNarrowWidth || wrapper.scrollWidth > wrapper.clientWidth + 1)
        && table.ownerDocument.documentElement.scrollWidth <= table.ownerDocument.documentElement.clientWidth + 1;
      const minimumWidthIsEnforced = parsedMinimumWidth >= minimumWidth && tableRect.width >= parsedMinimumWidth - 1;
      return {
        headersFit,
        headerPaddingIsConsistent,
        bodyTextPaddingIsConsistent,
        utilityColumnsFit: utilityMetrics.length === utilitySelectors.filter(selector => isRenderedLayoutElement(table.querySelector(`thead ${selector}`))).length && utilityMetrics.every(metric => metric.pass),
        minimumWidthIsEnforced,
        horizontalOverflowIsContained,
        pass: headersFit && headerPaddingIsConsistent && bodyTextPaddingIsConsistent && utilityMetrics.every(metric => metric.pass) && minimumWidthIsEnforced && horizontalOverflowIsContained,
        detail: `headers=${headerMetrics.map(metric => `${metric.label}:${metric.pass ? "fit" : "clip"}@${metric.paddingLeft}/${metric.paddingRight}`).join(" | ")}; body=${bodyTextMetrics.map(metric => metric.detail).join(" | ")}; utility=${utilityMetrics.map(metric => `${metric.selector}:${metric.detail}`).join(" | ")}; table=${Math.round(tableRect.width)}/${parsedMinimumWidth}; wrapper=${wrapper ? `${wrapper.scrollWidth}/${wrapper.clientWidth}:${wrapperStyle.overflowX}` : "missing"}`
      };
    }

    function projectRegionsModeLayout(table, { utilitySelectors = [], bodyTextSelectors = [] } = {}) {
      if (!table) return { pass: false, detail: "table missing" };
      const originalMode = table.getAttribute("data-location-mode");
      const originalRowState = Array.from(table.querySelectorAll("tbody tr[data-row-id]"))
        .map(row => `${row.dataset.rowId || ""}:${row.dataset.anchor || ""}:${row.dataset.region || ""}`)
        .join("|");
      let metrics;
      let regionHeaderIsVisible = false;
      let regionSelectIsVisible = false;
      let coordinateHeadersAreHidden = false;
      try {
        table.dataset.locationMode = "regions";
        metrics = semanticTableLayout(table, {
          utilitySelectors,
          bodyTextSelectors,
          minimumWidth: 1530
        });
        regionHeaderIsVisible = isRenderedLayoutElement(table.querySelector(".region-col"));
        regionSelectIsVisible = isRenderedLayoutElement(table.querySelector("tbody .region-input"));
        coordinateHeadersAreHidden = [".lon-col", ".lat-col"].every(selector => !isRenderedLayoutElement(table.querySelector(selector)));
      } finally {
        if (originalMode === null) table.removeAttribute("data-location-mode");
        else table.setAttribute("data-location-mode", originalMode);
      }
      const restoredRowState = Array.from(table.querySelectorAll("tbody tr[data-row-id]"))
        .map(row => `${row.dataset.rowId || ""}:${row.dataset.anchor || ""}:${row.dataset.region || ""}`)
        .join("|");
      const modeWasRestored = table.getAttribute("data-location-mode") === originalMode;
      const rowStateWasPreserved = restoredRowState === originalRowState;
      return {
        ...metrics,
        regionHeaderIsVisible,
        regionSelectIsVisible,
        coordinateHeadersAreHidden,
        modeWasRestored,
        rowStateWasPreserved,
        pass: Boolean(metrics?.pass)
          && regionHeaderIsVisible
          && regionSelectIsVisible
          && coordinateHeadersAreHidden
          && modeWasRestored
          && rowStateWasPreserved,
        detail: `${metrics?.detail || "metrics missing"}; regions=${regionHeaderIsVisible}/${regionSelectIsVisible}; coordinatesHidden=${coordinateHeadersAreHidden}; restored=${modeWasRestored}/${rowStateWasPreserved}`
      };
    }

    function translationGridLayout(doc) {
      const view = doc.defaultView;
      const header = doc.querySelector(".translation-column-labels");
      const row = doc.querySelector(".translation-row[data-entry-id]");
      const pane = doc.querySelector("#translateTablePane");
      const workbench = doc.querySelector(".translate-workbench");
      if (!header || !row || !pane || !workbench) return { pass: false, detail: "translation grid missing" };
      const isStacked = view.innerWidth <= 760;
      const headerCells = Array.from(header.children);
      const rowCells = Array.from(row.children);
      const headerMetrics = isStacked ? [] : headerCells.map((cell, index) => {
        const rect = cell.getBoundingClientRect();
        const rowRect = rowCells[index]?.getBoundingClientRect();
        const style = view.getComputedStyle(cell);
        const paddingLeft = parseFloat(style.paddingLeft) || 0;
        const paddingRight = parseFloat(style.paddingRight) || 0;
        const contentRect = elementContentBounds(cell);
        const isEmptyIndex = index === 0 && !cell.textContent.trim();
        const trackAligned = index === 3
          ? Boolean(rowRect) && Math.abs((rect.left + rect.right) / 2 - (rowRect.left + rowRect.right) / 2) <= 2
          : Boolean(rowRect) && Math.abs(rect.left - rowRect.left) <= 2 && Math.abs(rect.right - rowRect.right) <= 2;
        return {
          index,
          pass: trackAligned
            && (isEmptyIndex || (
              Math.abs(paddingLeft - 16) <= 1
              && Math.abs(paddingRight - 16) <= 1
              && Math.abs(paddingLeft - paddingRight) <= 1
              && cell.scrollWidth <= cell.clientWidth + 1
              && (!contentRect || contentRect.width <= 0 || (contentRect.left >= rect.left + paddingLeft - 1 && contentRect.right <= rect.right - paddingRight + 1))
            )),
          detail: `${index}:${Math.round(rect.width)}/${Math.round(rowRect?.width || 0)}@${paddingLeft}/${paddingRight}`
        };
      });
      const textControls = Array.from(row.querySelectorAll(".translation-input"));
      const rowPaddingIsConsistent = textControls.length === 2 && textControls.every(control => {
        const style = view.getComputedStyle(control);
        const paddingLeft = parseFloat(style.paddingLeft) || 0;
        const paddingRight = parseFloat(style.paddingRight) || 0;
        return Math.abs(paddingLeft - 16) <= 1 && Math.abs(paddingRight - 16) <= 1 && Math.abs(paddingLeft - paddingRight) <= 1;
      });
      const status = row.querySelector(".translation-status");
      const statusRect = status?.getBoundingClientRect();
      const rowRect = row.getBoundingClientRect();
      const rowStyle = view.getComputedStyle(row);
      const rowPaddingLeft = parseFloat(rowStyle.paddingLeft) || 0;
      const rowPaddingRight = parseFloat(rowStyle.paddingRight) || 0;
      const statusTrackRect = isStacked
        ? { left: rowRect.left + rowPaddingLeft, right: rowRect.right - rowPaddingRight }
        : { left: rowRect.right - rowPaddingRight - 180, right: rowRect.right - rowPaddingRight };
      const statusStyle = status ? view.getComputedStyle(status) : null;
      const statusPaddingLeft = parseFloat(statusStyle?.paddingLeft) || 0;
      const statusPaddingRight = parseFloat(statusStyle?.paddingRight) || 0;
      const utilityColumnsFit = Boolean(statusRect && statusTrackRect)
        && status.scrollWidth <= status.clientWidth + 1
        && statusPaddingLeft >= 8
        && statusPaddingRight >= 8
        && Math.abs(statusPaddingLeft - statusPaddingRight) <= 1
        && statusRect.left >= statusTrackRect.left - 1
        && statusRect.right <= statusTrackRect.right + 1;
      const workbenchStyle = view.getComputedStyle(workbench);
      const paneStyle = view.getComputedStyle(pane);
      const workbenchRect = workbench.getBoundingClientRect();
      const parsedMinimumWidth = parseFloat(workbenchStyle.minWidth) || 0;
      const minimumWidthIsEnforced = isStacked
        ? workbench.scrollWidth <= pane.clientWidth + 1
        : workbench.scrollWidth >= 904 && header.getBoundingClientRect().width <= workbench.scrollWidth + 1;
      const shouldScrollAtNarrowWidth = view.innerWidth <= 1080 && workbench.scrollWidth > pane.clientWidth + 1;
      const horizontalOverflowIsContained = ["auto", "scroll"].includes(paneStyle.overflowX)
        && (!shouldScrollAtNarrowWidth || pane.scrollWidth > pane.clientWidth + 1)
        && doc.documentElement.scrollWidth <= doc.documentElement.clientWidth + 1;
      const stackedLayoutIsSafe = !isStacked || (
        view.getComputedStyle(header).display === "none"
        && view.getComputedStyle(row).gridTemplateColumns.split(" ").length === 1
        && row.scrollWidth <= row.clientWidth + 1
      );
      return {
        headersFit: isStacked ? stackedLayoutIsSafe : headerMetrics.length === 4 && headerMetrics.every(metric => metric.pass),
        rowPaddingIsConsistent,
        utilityColumnsFit,
        minimumWidthIsEnforced,
        horizontalOverflowIsContained,
        pass: (isStacked ? stackedLayoutIsSafe : headerMetrics.length === 4 && headerMetrics.every(metric => metric.pass)) && rowPaddingIsConsistent && utilityColumnsFit && minimumWidthIsEnforced && horizontalOverflowIsContained,
        detail: `mode=${isStacked ? "stacked" : "columns"}; tracks=${headerMetrics.map(metric => metric.detail).join(" | ")}; min=${parsedMinimumWidth}; workbench=${Math.round(workbenchRect.width)}:${workbench.scrollWidth}; pane=${pane.scrollWidth}/${pane.clientWidth}:${paneStyle.overflowX}; status=${status ? `${status.scrollWidth}/${status.clientWidth}` : "missing"}`
      };
    }

    function csvPreviewTableFixtureLayout(doc, language = "en", locationMode = "coordinates") {
      const view = doc.defaultView;
      const useRegions = locationMode === "regions";
      const copy = language === "fr"
        ? {
          labels: ["Nom du projet", "Type", "Longitude", "Latitude", "Région", "État"],
          name: "Projet d'infrastructure",
          type: "Stratégies de transformation",
          region: "Colombie-Britannique",
          status: "Cartographié"
        }
        : {
          labels: ["Project name", "Type", "Longitude", "Latitude", "Region", "Status"],
          name: "Infrastructure project",
          type: "Transformative Strategies",
          region: "British Columbia",
          status: "Mapped"
        };
      const fixture = doc.createElement("div");
      fixture.className = "csv-preview-table-wrap";
      fixture.setAttribute("data-table-layout-fixture", "csv-preview");
      fixture.style.position = "fixed";
      fixture.style.left = "-10000px";
      fixture.style.top = "0";
      fixture.style.width = "520px";
      fixture.style.opacity = "0";
      fixture.style.pointerEvents = "none";
      fixture.innerHTML = `
        <table class="csv-preview-table" data-location-mode="${locationMode}">
          <thead><tr>
            <th class="csv-preview-name-col">${copy.labels[0]}</th>
            <th class="csv-preview-type-col">${copy.labels[1]}</th>
            ${useRegions
              ? `<th class="csv-preview-region-col">${copy.labels[4]}</th>`
              : `<th class="csv-preview-coordinate-col">${copy.labels[2]}</th><th class="csv-preview-coordinate-col">${copy.labels[3]}</th>`}
            <th class="csv-preview-status-col">${copy.labels[5]}</th>
          </tr></thead>
          <tbody><tr>
            <td class="csv-preview-name-cell">${copy.name}</td>
            <td class="csv-preview-type-cell">${copy.type}</td>
            ${useRegions
              ? `<td class="csv-preview-region-cell">${copy.region}</td>`
              : `<td class="csv-preview-coordinate-cell">-123.456</td><td class="csv-preview-coordinate-cell">49.2827</td>`}
            <td class="csv-preview-status-cell"><span class="csv-preview-badge" data-state="mapped">${copy.status}</span></td>
          </tr></tbody>
        </table>
      `;
      doc.body.append(fixture);
      const table = fixture.querySelector("table");
      const metrics = semanticTableLayout(table, {
        utilitySelectors: [".csv-preview-status-col"],
        bodyTextSelectors: [
          ".csv-preview-name-cell",
          ".csv-preview-type-cell",
          useRegions ? ".csv-preview-region-cell" : ".csv-preview-coordinate-cell",
          ".csv-preview-status-cell"
        ],
        minimumWidth: 0
      });
      const columnMinimums = [
        [".csv-preview-name-col", 320],
        [".csv-preview-type-col", 260],
        [useRegions ? ".csv-preview-region-col" : ".csv-preview-coordinate-col", useRegions ? 260 : 190],
        [".csv-preview-status-col", 280]
      ];
      const columnsRespectMinimums = columnMinimums.every(([selector, minimum]) => table.querySelector(selector)?.getBoundingClientRect().width >= minimum - 1);
      const tableUsesContentWidth = view.getComputedStyle(table).tableLayout === "auto"
        && table.getBoundingClientRect().width > fixture.clientWidth + 1
        && fixture.scrollWidth > fixture.clientWidth + 1;
      metrics.pass = metrics.pass && columnsRespectMinimums && tableUsesContentWidth;
      metrics.detail += `; mode=${locationMode}; columns=${columnMinimums.map(([selector]) => `${selector}:${Math.round(table.querySelector(selector)?.getBoundingClientRect().width || 0)}`).join(" | ")}; layout=${view.getComputedStyle(table).tableLayout}`;
      fixture.remove();
      return metrics;
    }

    async function runFocusedTableLayoutChecks(doc, checks, workspace) {
      const appWidth = doc.defaultView.innerWidth;
      const uiEnglishButton = doc.querySelector("[data-ui-language='en']");
      const uiFrenchButton = doc.querySelector("[data-ui-language='fr']");
      const useUiLanguage = async language => {
        const button = language === "fr" ? uiFrenchButton : uiEnglishButton;
        button?.click();
        await waitFor(() => doc.documentElement.lang === language, 2000);
      };

      if (workspace === "projects") {
        const table = doc.querySelector("#projectTable");
        const utilities = [".annotation-preview-col", ".status-col", ".line-col", ".select-col"];
        const bodyText = [".name-input", ".type-input", ".annotation-preview-cell", ".region-input", ".lon-input", ".lat-input", ".status-cell"];
        const authoringEnglish = doc.querySelector("[data-authoring-language='en']");
        const authoringFrench = doc.querySelector("[data-authoring-language='fr']");
        const checkLanguage = (language, minimumWidth) => {
          const label = language === "fr" ? "French" : "English";
          const metrics = semanticTableLayout(table, { utilitySelectors: utilities, bodyTextSelectors: bodyText, minimumWidth });
          assert(checks, `${label} Project table headers fit with consistent inline padding`, metrics.headersFit && metrics.headerPaddingIsConsistent, metrics.detail);
          assert(checks, `${label} Project row text uses the shared inline cell padding`, metrics.bodyTextPaddingIsConsistent, metrics.detail);
          assert(checks, `${label} Project utility columns contain their controls and status text`, metrics.utilityColumnsFit, metrics.detail);
          assert(checks, `${appWidth <= 1080 ? "1024px" : "Desktop"} ${language === "fr" ? "French " : ""}Project table ${language === "fr" ? "keeps horizontal overflow inside the table viewport" : "enforces its language-safe minimum width inside horizontal scrolling"}`, metrics.minimumWidthIsEnforced && metrics.horizontalOverflowIsContained, metrics.detail);
          const typePattern = language === "fr" ? /Stratégies de transformation/ : /Transformative Strategies/;
          const typeSelect = Array.from(table.querySelectorAll(".type-input")).find(select => typePattern.test(select.selectedOptions[0]?.textContent || ""));
          const typeFit = selectOptionTextFit(typeSelect, typeSelect?.selectedOptions[0]?.textContent.trim());
          assert(checks, `${label} built-in Project Type value fits inside its selected control`, typeFit.pass, typeFit.detail);
          const regions = projectRegionsModeLayout(table, { utilitySelectors: utilities, bodyTextSelectors: bodyText });
          assert(checks, `${label} Project Region-anchor columns fit without mutating row state`, regions.pass, regions.detail);
          for (const locationMode of ["coordinates", "regions"]) {
            const csv = csvPreviewTableFixtureLayout(doc, language, locationMode);
            const modeLabel = locationMode === "regions" ? "Region-mode " : "";
            assert(checks, `${label} ${modeLabel}CSV preview columns fit ${locationMode === "regions" ? "inside" : "with consistent padding and"} isolated horizontal scrolling`, csv.pass, csv.detail);
          }
        };
        await useUiLanguage("en");
        authoringEnglish?.click();
        await waitFor(() => Array.from(table.querySelectorAll(".type-input")).some(select => /Transformative Strategies/.test(select.selectedOptions[0]?.textContent || "")), 2000);
        checkLanguage("en", table.dataset.locationMode === "regions" ? 1530 : 1650);
        await useUiLanguage("fr");
        authoringFrench?.click();
        await waitFor(() => Array.from(table.querySelectorAll(".type-input")).some(select => /Stratégies de transformation/.test(select.selectedOptions[0]?.textContent || "")), 2000);
        checkLanguage("fr", table.dataset.locationMode === "regions" ? 1530 : 1650);
        authoringEnglish?.click();
        await useUiLanguage("en");
        return;
      }

      if (workspace === "regions") {
        const table = doc.querySelector("#regionTable");
        const utilities = [".region-included-col", ".region-status-col", ".region-count-col", ".region-value-col", ".region-fill-col"];
        const bodyText = [".region-table-name", ".region-status-input", ".region-count-cell", ".region-value-cell", ".region-fill-picker"];
        const checkLanguage = language => {
          const label = language === "fr" ? "French" : "English";
          const metrics = semanticTableLayout(table, { utilitySelectors: utilities, bodyTextSelectors: bodyText, minimumWidth: 1430 });
          assert(checks, `${label} Map baselayer headers fit with consistent inline padding`, metrics.headersFit && metrics.headerPaddingIsConsistent, metrics.detail);
          assert(checks, `${label} Map baselayer row text uses the shared inline cell padding`, metrics.bodyTextPaddingIsConsistent, metrics.detail);
          assert(checks, `${label} Map baselayer utility columns contain their controls and values`, metrics.utilityColumnsFit, metrics.detail);
          assert(checks, `${appWidth <= 1080 ? "1024px" : "Desktop"} ${language === "fr" ? "French " : ""}Map baselayer ${language === "fr" ? "keeps horizontal overflow inside the table viewport" : "enforces its language-safe minimum width inside horizontal scrolling"}`, metrics.minimumWidthIsEnforced && metrics.horizontalOverflowIsContained, metrics.detail);
          const status = table.querySelector(".region-status-input");
          const longestLabel = language === "fr" ? "Conclu, pas en vigueur" : "Concluded, not in force";

    function floatingSurfaceState(surface, { boundary = null, hitTarget = null } = {}) {
      if (!surface) return { pass: false, detail: "surface missing" };
      const view = surface.ownerDocument.defaultView;
      const rect = surface.getBoundingClientRect();
      const rawBoundaryRect = boundary?.getBoundingClientRect() || {
        top: 0,
        right: view.innerWidth,
        bottom: view.innerHeight,
        left: 0
      };
      const boundaryRect = {
        top: Math.max(0, rawBoundaryRect.top),
        right: Math.min(view.innerWidth, rawBoundaryRect.right),
        bottom: Math.min(view.innerHeight, rawBoundaryRect.bottom),
        left: Math.max(0, rawBoundaryRect.left)
      };
      const target = hitTarget || surface;
      const targetRect = target.getBoundingClientRect();
      const sampleX = Math.min(Math.max(targetRect.left + targetRect.width / 2, 0), view.innerWidth - 1);
      const sampleY = Math.min(Math.max(targetRect.top + targetRect.height / 2, 0), view.innerHeight - 1);
      const topNode = surface.ownerDocument.elementFromPoint(sampleX, sampleY);
      const style = view.getComputedStyle(surface);
      const hasSize = rect.width > 0 && rect.height > 0;
      const isRendered = style.display !== "none" && style.visibility !== "hidden";
      const isContained = rect.left >= boundaryRect.left - 1
        && rect.right <= boundaryRect.right + 1
        && rect.top >= boundaryRect.top - 1
        && rect.bottom <= boundaryRect.bottom + 1;
      const isTopmost = Boolean(topNode && (target === topNode || target.contains(topNode)));
      return {
        pass: hasSize && isRendered && isContained && isTopmost,
        detail: `surface=${Math.round(rect.left)},${Math.round(rect.top)}-${Math.round(rect.right)},${Math.round(rect.bottom)} boundary=${Math.round(boundaryRect.left)},${Math.round(boundaryRect.top)}-${Math.round(boundaryRect.right)},${Math.round(boundaryRect.bottom)} top=${topNode?.tagName || "none"}#${topNode?.id || ""}.${topNode?.className?.baseVal || topNode?.className || ""} contained=${isTopmost} text=${String(topNode?.textContent || "").trim().slice(0, 40)}`

    function parseCssRgb(value) {
      const colour = String(value || "").trim();
      const hexMatch = colour.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
      if (hexMatch) {
        const hex = hexMatch[1].length === 3
          ? hexMatch[1].split("").map(channel => channel + channel).join("")
          : hexMatch[1];
        return [0, 2, 4].map(offset => Number.parseInt(hex.slice(offset, offset + 2), 16));
      }
      const match = colour.match(/rgba?\(([^)]+)\)/i);
      if (!match) return null;
      const channels = match[1].split(",").slice(0, 3).map(part => Number.parseFloat(part.trim()));
      return channels.length === 3 && channels.every(Number.isFinite) ? channels : null;
    }

    function cssColoursMatch(first, second) {
      const firstRgb = parseCssRgb(first);

    function relativeLuminanceFromCssColor(value) {
      const rgb = parseCssRgb(value);
      if (!rgb) return null;

    function visibleText(root) {
      if (!root) return "";
      const walker = root.ownerDocument.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const chunks = [];
      while (walker.nextNode()) {
        const textNode = walker.currentNode;
        const text = textNode.textContent.trim();
        if (!text) continue;
        let node = textNode.parentElement;
        let visible = true;
        while (node && node !== root.parentElement) {
          const style = node.ownerDocument.defaultView.getComputedStyle(node);
          if (style.display === "none" || style.visibility === "hidden") {
            visible = false;
            break;
          }
          node = node.parentElement;
        }
        if (visible) chunks.push(text);
      }
      return chunks
        .join(" ")
        .replace(/\s+/g, " ")
        .trim();
    }

              const excelFrench = "Nom Excel importe";
              const textEncoder = new frame.contentWindow.TextEncoder();
              const writeUint16 = (view, offset, value) => view.setUint16(offset, value, true);
              const writeUint32 = (view, offset, value) => view.setUint32(offset, value, true);
              const xmlEscape = value => String(value || "").replace(/[<>&"]/g, char => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[char]));
              const createStoredZip = entries => {
                const chunks = [];
                const centralChunks = [];
                let offset = 0;
                entries.forEach(entry => {
                  const nameBytes = textEncoder.encode(entry.name);
                  const dataBytes = textEncoder.encode(entry.content);
                  const local = new Uint8Array(30);
                  const localView = new DataView(local.buffer);
                  writeUint32(localView, 0, 0x04034b50);
                  writeUint16(localView, 4, 20);
                  writeUint16(localView, 8, 0);
                  writeUint32(localView, 18, dataBytes.length);
                  writeUint32(localView, 22, dataBytes.length);
                  writeUint16(localView, 26, nameBytes.length);
                  chunks.push(local, nameBytes, dataBytes);
                  const central = new Uint8Array(46);
                  const centralView = new DataView(central.buffer);
                  writeUint32(centralView, 0, 0x02014b50);
                  writeUint16(centralView, 4, 20);
                  writeUint16(centralView, 6, 20);
                  writeUint16(centralView, 10, 0);
                  writeUint32(centralView, 20, dataBytes.length);
                  writeUint32(centralView, 24, dataBytes.length);
                  writeUint16(centralView, 28, nameBytes.length);
                  writeUint32(centralView, 42, offset);
                  centralChunks.push(central, nameBytes);
                  offset += local.length + nameBytes.length + dataBytes.length;
                });
                const centralSize = centralChunks.reduce((total, chunk) => total + chunk.length, 0);
                const end = new Uint8Array(22);
                const endView = new DataView(end.buffer);
                writeUint32(endView, 0, 0x06054b50);
                writeUint16(endView, 8, entries.length);
                writeUint16(endView, 10, entries.length);
                writeUint32(endView, 12, centralSize);
                writeUint32(endView, 16, offset);
                return new frame.contentWindow.Blob([...chunks, ...centralChunks, end], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
              };
              const sheetXml = `<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData><row r="1"><c r="A1" t="inlineStr"><is><t>English project name</t></is></c><c r="B1" t="inlineStr"><is><t>French project name</t></is></c></row><row r="2"><c r="A2" t="inlineStr"><is><t>${xmlEscape(editedEnglishTranslation)}</t></is></c><c r="B2" t="inlineStr"><is><t>${xmlEscape(excelFrench)}</t></is></c></row></sheetData></worksheet>`;
              const workbookBlob = createStoredZip([
                { name: "[Content_Types].xml", content: `<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>` },
                { name: "_rels/.rels", content: `<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
                { name: "xl/workbook.xml", content: `<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Translations" sheetId="1" r:id="rId1"/></sheets></workbook>` },
                { name: "xl/_rels/workbook.xml.rels", content: `<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>` },
                { name: "xl/worksheets/sheet1.xml", content: sheetXml }
              ]);
              const excelTransfer = new frame.contentWindow.DataTransfer();
              excelTransfer.items.add(new frame.contentWindow.File([workbookBlob], "project-translations.xlsx", { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
              Object.defineProperty(translationImportInput, "files", { value: excelTransfer.files, configurable: true });
              translationImportInput.dispatchEvent(new frame.contentWindow.Event("change", { bubbles: true }));
              await waitFor(() => doc.querySelector("#csvMapDialog")?.hidden === false && /project-translations\.xlsx/.test(doc.querySelector("#csvMapDialog")?.textContent || ""), 4000);
              assert(checks, "Translation Excel import reuses the CSV column mapping dialog", /Map translation columns|Associer les colonnes de traduction/.test(doc.querySelector("#csvMapDialog")?.textContent || ""));
              doc.querySelector("#confirmCsvMapBtn")?.click();
              await waitFor(() => doc.querySelector(importedSelector)?.value === excelFrench, 4000);
              assert(checks, "Translation Excel import updates the matched project point French name", doc.querySelector(importedSelector)?.value === excelFrench);
            }
          }
          if (requestedWorkspace === "quality") {
            await waitFor(() => doc.querySelectorAll("#qualityMetricsPanel .quality-card").length >= 5, 12000);
            const cards = doc.querySelectorAll("#qualityMetricsPanel .quality-card");
            assert(checks, "Quality metrics render as cards", cards.length >= 5);
            assert(checks, "Quality cards expose severity state", Array.from(cards).every(card => ["ok", "review", "danger"].includes(card.dataset.state)));
            assert(checks, "Quality summary exposes readiness state", ["ok", "review", "info"].includes(doc.querySelector("#qualitySummaryBanner")?.dataset.state));
            assert(checks, "Quality review banner omits the retired explanatory sentence", !/Actionable|Passive counts|Éléments à corriger|décomptes informatifs/.test(doc.querySelector("#qualitySummaryBanner")?.textContent || ""));
            assert(checks, "Detailed checklist remains available", Boolean(doc.querySelector(".quality-detail-checklist #statusBox")));
            assert(checks, "Quality Properties are contextual", Boolean(doc.querySelector("#propertiesSelectionControls [data-property-kind='quality']")));
            assert(checks, "Quality workspace shows render timing telemetry", doc.querySelectorAll("#performanceTelemetryMetrics .performance-metric").length === 5 && ["ok", "warning"].includes(doc.querySelector("#performanceTelemetryStatus")?.dataset.state));
            const overlapCountFromLabels = labelNodes => {
              const rects = labelNodes.map(node => {
                const datum = node.__data__;
                const fontSize = datum.lineHeight / 1.2;
                const x = datum.labelSide === "left" ? datum.labelX - datum.textWidth : datum.labelX;
                const y = datum.labelY - fontSize;
                const height = datum.textHeight - datum.lineHeight + fontSize;
                return {
                  x0: x - 10,
                  y0: y - 10,
                  x1: x + datum.textWidth + 10,
                  y1: y + height + 10,
                  centerX: x + datum.textWidth / 2,
                  centerY: y + height / 2
                };
              });
              let overlaps = 0;
              for (let i = 0; i < rects.length; i += 1) {
                for (let j = i + 1; j < rects.length; j += 1) {
                  if (frame.contentWindow.PLOTYPUS_GEOMETRY.rectsOverlap(rects[i], rects[j])) overlaps += 1;
                }
              }
              return { overlaps, rects };
            };
            const getOverlapCardValue = () => {
              const card = Array.from(doc.querySelectorAll("#qualityMetricsPanel .quality-card"))
                .find(node => /Label overlaps|Chevauchements d'étiquettes/i.test(node.querySelector("h3")?.textContent || ""));
              return Number(card?.querySelector("header > strong")?.textContent || NaN);
            };
            const initialOverlapValue = getOverlapCardValue();
            doc.querySelector("#previewTableTab")?.click();
            await waitFor(() => doc.body.dataset.workspaceView === "preview" && !doc.querySelector("#canvasQualityPill")?.hidden, 4000);
            const movableLabels = Array.from(doc.querySelectorAll("#mapSvg .map-label")).filter(node => node.__data__);
            const initialGeometry = overlapCountFromLabels(movableLabels);
            const isolatedIndex = initialGeometry.rects.findIndex((rect, index) => initialGeometry.rects.every((other, otherIndex) => (
              index === otherIndex || !frame.contentWindow.PLOTYPUS_GEOMETRY.rectsOverlap(rect, other)
            )));
            const targetIndex = movableLabels.findIndex((_, index) => index !== isolatedIndex);
            assert(checks, "Quality refresh regression has movable non-overlapping labels", movableLabels.length >= 2 && isolatedIndex >= 0 && targetIndex >= 0);
            if (isolatedIndex >= 0 && targetIndex >= 0) {
              const svgNode = doc.querySelector("#mapSvg");
              const toScreenPoint = rect => {
                const point = svgNode.createSVGPoint();
                point.x = rect.centerX;
                point.y = rect.centerY;
                return point.matrixTransform(svgNode.getScreenCTM());
              };
              const sourcePoint = toScreenPoint(initialGeometry.rects[isolatedIndex]);
              const targetPoint = toScreenPoint(initialGeometry.rects[targetIndex]);
              const sourceLabel = movableLabels[isolatedIndex];
              const qualityAnalysisBefore = frame.contentWindow.PLOTYPUS_QUALITY_ANALYSIS?.snapshot();
              sourceLabel.dispatchEvent(new frame.contentWindow.MouseEvent("mousedown", {
                bubbles: true,
                cancelable: true,
                button: 0,
                buttons: 1,
                clientX: sourcePoint.x,
                clientY: sourcePoint.y,
                view: frame.contentWindow
              }));
              frame.contentWindow.dispatchEvent(new frame.contentWindow.MouseEvent("mousemove", {
                bubbles: true,
                cancelable: true,
                buttons: 1,
                clientX: targetPoint.x,
                clientY: targetPoint.y,
                view: frame.contentWindow
              }));
              frame.contentWindow.dispatchEvent(new frame.contentWindow.MouseEvent("mouseup", {
                bubbles: true,
                cancelable: true,
                button: 0,
                clientX: targetPoint.x,
                clientY: targetPoint.y,
                view: frame.contentWindow
              }));
              const movedOverlapValue = overlapCountFromLabels(movableLabels).overlaps;
              const mapBeforeQualityRefresh = doc.querySelector("#mapSvg")?.innerHTML || "";
              const renderSamplesBeforeQualityRefresh = performanceApi?.snapshot().samples.length || 0;
              // D3 suppresses the click in the same task as drag-end; a real tab click arrives in the next task.
              await new Promise(resolve => setTimeout(resolve, 0));
              const qualityOpenStartedAt = performance.now();
              doc.querySelector("#qualityTableTab")?.click();
              const qualityOpenDuration = performance.now() - qualityOpenStartedAt;
              const qualityAnalysisAtOpen = frame.contentWindow.PLOTYPUS_QUALITY_ANALYSIS?.snapshot();
              const qualityFinishedBeforeOpen = Boolean(
                qualityAnalysisBefore
                && qualityAnalysisAtOpen
                && qualityAnalysisAtOpen.pending === false
                && qualityAnalysisAtOpen.completed > qualityAnalysisBefore.completed
              );
              assert(
                checks,
                "Opening Map quality remains responsive while analysis is pending or already complete",
                qualityOpenDuration < 120
                  && doc.body.dataset.workspaceView === "quality"
                  && (doc.querySelector("#qualityTablePane")?.getAttribute("aria-busy") === "true" || qualityFinishedBeforeOpen),
                JSON.stringify({
                  durationMs: Number(qualityOpenDuration.toFixed(1)),
                  workspace: doc.body.dataset.workspaceView,
                  ariaBusy: doc.querySelector("#qualityTablePane")?.getAttribute("aria-busy"),
                  analysis: qualityAnalysisAtOpen
                })
              );
              await waitFor(() => (
                doc.body.dataset.workspaceView === "quality"
                && getOverlapCardValue() === movedOverlapValue
                && Number(doc.querySelector("#canvasQualityPill .canvas-quality-metric strong")?.textContent || NaN) === movedOverlapValue
                && frame.contentWindow.PLOTYPUS_QUALITY_ANALYSIS?.snapshot().pending === false
              ), 4000);
              const qualityAnalysisAfter = frame.contentWindow.PLOTYPUS_QUALITY_ANALYSIS?.snapshot();
              const overlapChecklist = Array.from(doc.querySelectorAll("#statusBox .checklist-item"))
                .find(node => /Label overlaps|Chevauchements d'étiquettes/i.test(node.querySelector("strong")?.textContent || ""));
              const qualityVerdict = doc.querySelector("#propertiesSelectionControls .quality-properties-verdict")?.textContent || "";
              const qualityRequestDelta = qualityAnalysisAfter.requests - qualityAnalysisBefore.requests;
              const qualityStartedDelta = qualityAnalysisAfter.started - qualityAnalysisBefore.started;
              const qualityCompletedDelta = qualityAnalysisAfter.completed - qualityAnalysisBefore.completed;
              const qualityCoalescedDelta = qualityAnalysisAfter.coalesced - qualityAnalysisBefore.coalesced;
              const overlappedRequests = qualityRequestDelta === 2 && qualityCoalescedDelta >= 1;
              const reusedCompletedRequest = qualityRequestDelta === 1 && qualityFinishedBeforeOpen;
              assert(checks, "Moving a label refreshes the map quality pill in the background", movedOverlapValue > initialGeometry.overlaps && movedOverlapValue > initialOverlapValue, `${initialOverlapValue} -> ${movedOverlapValue}`);
              assert(checks, "Opening Map quality recomputes moved-label metrics", getOverlapCardValue() === movedOverlapValue && overlapChecklist?.textContent.includes(String(movedOverlapValue)) && qualityVerdict.includes(String(movedOverlapValue)), `${getOverlapCardValue()} / ${overlapChecklist?.textContent || ""} / ${qualityVerdict}`);
              assert(checks, "Map quality coalesces overlapping requests or reuses a completed background analysis", Boolean(qualityAnalysisBefore && qualityAnalysisAfter) && qualityStartedDelta === 1 && qualityCompletedDelta === 1 && (overlappedRequests || reusedCompletedRequest), JSON.stringify({ before: qualityAnalysisBefore, atOpen: qualityAnalysisAtOpen, after: qualityAnalysisAfter }));
              assert(checks, "Quality refresh does not re-plot the map", (doc.querySelector("#mapSvg")?.innerHTML || "") === mapBeforeQualityRefresh);
              assert(checks, "Quality refresh records no render timing", (performanceApi?.snapshot().samples.length || 0) === renderSamplesBeforeQualityRefresh);
              doc.querySelector("#previewTableTab")?.click();
              await waitFor(() => doc.body.dataset.workspaceView === "preview", 2000);

              const currentSourcePoint = toScreenPoint(overlapCountFromLabels(movableLabels).rects[isolatedIndex]);
              const previewAnalysisBefore = frame.contentWindow.PLOTYPUS_QUALITY_ANALYSIS?.snapshot();
              sourceLabel.dispatchEvent(new frame.contentWindow.MouseEvent("mousedown", {
                bubbles: true,
                cancelable: true,
                button: 0,
                buttons: 1,
                clientX: currentSourcePoint.x,
                clientY: currentSourcePoint.y,
                view: frame.contentWindow
              }));
              frame.contentWindow.dispatchEvent(new frame.contentWindow.MouseEvent("mousemove", {
                bubbles: true,
                cancelable: true,
                buttons: 1,
                clientX: sourcePoint.x,
                clientY: sourcePoint.y,
                view: frame.contentWindow
              }));
              frame.contentWindow.dispatchEvent(new frame.contentWindow.MouseEvent("mouseup", {
                bubbles: true,
                cancelable: true,
                button: 0,
                clientX: sourcePoint.x,
                clientY: sourcePoint.y,
                view: frame.contentWindow
              }));
              const previewCompletedOverlapValue = overlapCountFromLabels(movableLabels).overlaps;
              assert(checks, "A second label move starts quality analysis while Preview remains active", frame.contentWindow.PLOTYPUS_QUALITY_ANALYSIS?.snapshot().pending === true);
              await waitFor(() => (
                doc.body.dataset.workspaceView === "preview"
                && frame.contentWindow.PLOTYPUS_QUALITY_ANALYSIS?.snapshot().pending === false
                && frame.contentWindow.PLOTYPUS_QUALITY_ANALYSIS?.snapshot().completed > previewAnalysisBefore.completed
              ), 4000);
              doc.querySelector("#qualityTableTab")?.click();
              await waitFor(() => doc.body.dataset.workspaceView === "quality" && doc.querySelector("#qualityTablePane")?.getAttribute("aria-busy") === "false", 2000);
              const previewCompletedChecklist = Array.from(doc.querySelectorAll("#statusBox .checklist-item"))
                .find(node => /Label overlaps|Chevauchements d'étiquettes/i.test(node.querySelector("strong")?.textContent || ""));
              assert(checks, "Map quality publishes a background result completed before the tab opens", getOverlapCardValue() === previewCompletedOverlapValue && previewCompletedChecklist?.textContent.includes(String(previewCompletedOverlapValue)), `${getOverlapCardValue()} / ${previewCompletedChecklist?.textContent || ""}`);
              doc.querySelector("#previewTableTab")?.click();
              await waitFor(() => doc.body.dataset.workspaceView === "preview", 2000);
            }
            const locateNextAction = doc.querySelector("#canvasQualityPill [data-property-action='open-map']");
            const locateNextRect = locateNextAction?.getBoundingClientRect();
            assert(checks, "Quality Locate next action is available on the visible map pill", Boolean(locateNextAction && locateNextRect && locateNextRect.width > 0 && locateNextRect.height > 0));
            const clickVisibleLocateNext = () => {
              const action = doc.querySelector("#canvasQualityPill [data-property-action='open-map']");
              action?.dispatchEvent(new frame.contentWindow.MouseEvent("click", { bubbles: true, cancelable: true, view: frame.contentWindow }));
            };
            const getLocatedLabelId = () => doc.querySelector("#mapSvg .map-label.is-quality-located")?.dataset.layoutId || "";
            const getLocatedStatus = () => doc.querySelector("#statusBox")?.textContent || "";
            clickVisibleLocateNext();
            await waitFor(() => doc.body.dataset.workspaceView === "preview" && getLocatedLabelId() && /Located quality item 1 of \d+/.test(getLocatedStatus()), 4000);
            const firstLocatedLabelId = getLocatedLabelId();
            const locateTotalMatch = getLocatedStatus().match(/Located quality item 1 of (\d+)/);
            const locateTotal = locateTotalMatch ? Number(locateTotalMatch[1]) : 0;
            assert(checks, "Quality Locate next selects and highlights a map label from the visible map pill", doc.body.dataset.workspaceView === "preview" && Boolean(firstLocatedLabelId) && locateTotal > 0 && /Extra info|Infos supplémentaires/.test(doc.querySelector("#propertiesTitle")?.textContent || ""), doc.querySelector("#propertiesTitle")?.textContent || "");
            for (let locateIndex = 2; locateIndex <= locateTotal; locateIndex += 1) {
              clickVisibleLocateNext();
              await waitFor(() => new RegExp(`Located quality item ${locateIndex} of ${locateTotal}`).test(getLocatedStatus()), 4000);
            }
            clickVisibleLocateNext();
            await waitFor(() => /Located quality item 1 of \d+/.test(getLocatedStatus()) && getLocatedLabelId() === firstLocatedLabelId, 4000);
            assert(checks, "Quality Locate next repeats after the final review label", getLocatedLabelId() === firstLocatedLabelId, getLocatedStatus());
            doc.querySelector("#qualityTableTab")?.click();
            await waitFor(() => doc.body.dataset.workspaceView === "quality", 2000);
            const detailsAction = doc.querySelector("#qualityMetricsPanel [data-property-action='open-map-details']");
            detailsAction?.click();
            await waitFor(() => doc.querySelector("#mapDetailsDialog")?.hidden === false, 2000);
            assert(checks, "Quality remediation opens Map details", Boolean(detailsAction) && doc.querySelector("#mapDetailsDialog")?.hidden === false);
            doc.querySelector("#mapDetailsDialog [data-dialog-close='map-details']")?.click();
            assert(checks, "Quality remediation dialog closes cleanly", doc.querySelector("#mapDetailsDialog")?.hidden === true);
          }
          const failed = checks.filter(check => !check.pass);
          result.textContent = JSON.stringify({
            status: failed.length ? "failed" : "ok",
            workspace: requestedWorkspace,
            viewport: { width: innerWidth, height: innerHeight },
            checks,
            failures: failed.length,
            frameErrors,
            performance: performanceApi?.snapshot() || null
          }, null, 2);
          return;
        }

        const exportButton = doc.querySelector("#exportMenuBtn");
        const exportMenu = doc.querySelector("#exportMenu");
        const pngButton = doc.querySelector("#ribbonExportPngBtn");
        const svgButton = doc.querySelector("#ribbonExportSvgBtn");
        const projectTab = doc.querySelector("#projectTableTab");
        const mapTab = doc.querySelector("#previewTableTab");

        assert(checks, "Map workspace is the default", mapTab.classList.contains("is-active") && doc.body.dataset.workspaceView === "preview");
        assert(checks, "Export menu starts closed", exportMenu.hidden && exportButton.getAttribute("aria-expanded") === "false");

        exportButton.click();
        assert(checks, "Export click opens menu", !exportMenu.hidden && exportButton.getAttribute("aria-expanded") === "true");
        assert(checks, "PNG and SVG commands retain stable IDs", pngButton?.getAttribute("role") === "menuitem" && svgButton?.getAttribute("role") === "menuitem");

        dispatchKey(exportButton, "Escape");
        assert(checks, "Escape closes export menu", exportMenu.hidden && exportButton.getAttribute("aria-expanded") === "false");
        assert(checks, "Escape restores trigger focus", doc.activeElement === exportButton);

        dispatchKey(exportButton, "ArrowDown");
        assert(checks, "Arrow Down opens and focuses first command", !exportMenu.hidden && doc.activeElement === pngButton);
        dispatchKey(pngButton, "ArrowDown");
        assert(checks, "Arrow keys move through export commands", doc.activeElement === svgButton);
        dispatchKey(svgButton, "Escape");

        projectTab.click();
        assert(checks, "Workspace navigation activates Project points", projectTab.classList.contains("is-active") && doc.body.dataset.workspaceView === "projects");
        mapTab.click();
        assert(checks, "Workspace navigation returns to Map", mapTab.classList.contains("is-active") && doc.body.dataset.workspaceView === "preview");

        exportButton.click();
        assert(checks, "Export menu is left open for screenshot review", !exportMenu.hidden);
        const failed = checks.filter(check => !check.pass);
        result.textContent = JSON.stringify({
          status: failed.length ? "failed" : "ok",
          viewport: { width: innerWidth, height: innerHeight },
          checks,
          failures: failed.length,
          performance: performanceApi?.snapshot() || null
        }, null, 2);
      } catch (error) {
        result.textContent = JSON.stringify({
          status: "error",
          message: error.message,
          checks,
          frameErrors,
          performance: frame.contentWindow?.PLOTYPUS_RENDER_PERFORMANCE?.snapshot() || null
        }, null, 2);
      }
    });
    frame.src = frame.dataset.src;
  </script>
</body>
</html>
